<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>附件1-【教学】内训师-需求表</title>
  <style>
    :root {
      --bg: #f4f8ef;
      --panel: #fff;
      --ink: #1f2a24;
      --muted: #66736b;
      --green: #4f9c43;
      --line: #cdddc8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: linear-gradient(180deg, #eef8e7, var(--bg));
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      line-height: 1.65;
    }
    .wrap { max-width: 980px; margin: 0 auto; padding: 28px 18px 44px; }
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin: -28px -18px 18px;
      padding: 14px 18px;
      background: rgba(244, 248, 239, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .toolbar strong { font-size: 16px; }
    .toolbar a {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 0 12px;
      border-radius: 7px;
      color: white;
      background: var(--green);
      text-decoration: none;
      font-weight: 700;
      white-space: nowrap;
    }
    .paper {
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      box-shadow: 0 16px 46px rgba(58, 103, 49, 0.12);
    }
    .doc-title { margin: 0 0 18px; text-align: center; font-size: 24px; line-height: 1.35; }
    .doc-heading { margin: 22px 0 8px; font-size: 17px; color: #356c2d; }
    .doc-p { margin: 8px 0; }
    .doc-table { width: 100%; margin: 14px 0 20px; border-collapse: collapse; table-layout: fixed; }
    .doc-table td {
      min-height: 38px;
      padding: 8px 10px;
      border: 1px solid #b8c7b5;
      vertical-align: middle;
      word-break: break-word;
      font-size: 14px;
    }
    .doc-table tr:first-child td { background: #edf8e8; font-weight: 700; }
    .note { margin-top: 16px; color: var(--muted); font-size: 13px; }
    @media print { .toolbar { display: none; } body { background: #fff; } .paper { box-shadow: none; border: 0; padding: 0; } }
  </style>
</head>
<body>
  <main class="wrap">

    </section>
  </main>
</body>
</html>
